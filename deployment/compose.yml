# Frappe Health (Marley) + ERPNext stack, adapted from frappe_docker pwd.yml.
# Requires the custom image built by ./frappe/build-image.sh (tag: hims-frappe:v15).
#
# Two connection modes (see ./setup.sh, which picks one and writes the env files):
#   local   installs a full Frappe Health backend in Docker:
#             docker compose --profile local up -d
#   remote  connects the BFF to an existing Frappe server (FRAPPE_BASE_URL):
#             docker compose up -d
#
# Services:
#   frontend   nginx serving Frappe Desk + REST API on :8080   [local profile]
#   backend    gunicorn (Frappe app server)                    [local profile]
#   create-site  one-shot: creates site "frontend", installs erpnext + healthcare [local]
#   bff        thin backend-for-frontend (this repo's /bff) — internal only
#   web        the HIMS React app on :3000, proxies /api → bff
#
# Secrets come from .env (see .env.example).

services:
  backend:
    image: hims-frappe:v15
    profiles: [local]
    networks: [frappe_network]
    restart: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: hims-frappe:v15
    profiles: [local]
    networks: [frappe_network]
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: hims-frappe:v15
    profiles: [local]
    networks: [frappe_network]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint: [bash, -c]
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]]; do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1;
          fi;
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/frontend" ]; then
          echo "Site frontend already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' \
            --admin-password=${ADMIN_PASSWORD} \
            --db-root-username=root --db-root-password=${DB_ROOT_PASSWORD} \
            --install-app erpnext --set-default frontend;
          bench --site frontend install-app healthcare;
        fi;
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

  db:
    image: mariadb:11.8
    profiles: [local]
    networks: [frappe_network]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: hims-frappe:v15
    profiles: [local]
    networks: [frappe_network]
    depends_on:
      - websocket
      - backend
    restart: on-failure
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "8080:8080"

  queue-long:
    image: hims-frappe:v15
    profiles: [local]
    networks: [frappe_network]
    restart: on-failure
    command: [bench, worker, --queue, "long,default,short"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: hims-frappe:v15
    profiles: [local]
    networks: [frappe_network]
    restart: on-failure
    command: [bench, worker, --queue, "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    profiles: [local]
    networks: [frappe_network]
    restart: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    profiles: [local]
    networks: [frappe_network]
    restart: on-failure

  scheduler:
    image: hims-frappe:v15
    profiles: [local]
    networks: [frappe_network]
    restart: on-failure
    command: [bench, schedule]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: hims-frappe:v15
    profiles: [local]
    networks: [frappe_network]
    restart: on-failure
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ---- HIMS custom layer -------------------------------------------------

  bff:
    build:
      context: ../bff
    networks: [frappe_network]
    restart: on-failure
    env_file:
      - ./bff/.env
    environment:
      # local mode: compose-internal address of the Frappe nginx service.
      # remote mode: set FRAPPE_BASE_URL in .env (e.g. https://frappe.example.com).
      FRAPPE_BASE_URL: ${FRAPPE_BASE_URL:-http://frontend:8080}
    # No depends_on create-site: in remote mode the Frappe stack is not started,
    # and the BFF tolerates Frappe being unreachable (health reports "degraded").
    # In local mode, wait for create-site to finish before generating API keys —
    # see deployment/README.md.

  web:
    build:
      context: ..
      dockerfile: deployment/web/Dockerfile
      args:
        # Must match BFF_API_TOKEN in bff/.env (empty = open, local dev only).
        VITE_BFF_TOKEN: ${VITE_BFF_TOKEN:-}
    networks: [frappe_network]
    restart: on-failure
    ports:
      - "3000:80"
    depends_on:
      - bff

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
